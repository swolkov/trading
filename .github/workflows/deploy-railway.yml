name: Deploy Futures Engine to Railway

# RETIRED 2026-08-31 with the futures pivot to Kraken margin. The futures Railway services
# (futures-engine-live / futures-engine / databento-sidecar) are stopped and the Databento
# subscription is cancelled, so this pipeline can only ever FAIL — and it used to fire on
# every push to main touching src/lib/** (which every margin change does), spamming failure
# emails. Trigger changed to manual-only (workflow_dispatch) so it never auto-runs. The steps
# are left intact, not deleted, so futures could be revived by flipping this back to `push`
# and pointing PRICE_FEED at a live producer — but nothing runs it automatically anymore.
on:
  workflow_dispatch:

concurrency:
  group: futures-railway-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.41.2

      - name: Install verification dependencies
        run: npm ci --ignore-scripts

      - name: Deploy Databento sidecar first
        run: |
          deploy_output="$(railway up ./sidecar --path-as-root --service databento-sidecar --detach --json)"
          deployment_id="$(printf '%s\n' "$deploy_output" | tail -n 1 | jq -r '.deploymentId // .id // empty')"
          test -n "$deployment_id"
          for _ in $(seq 1 120); do
            status="$(railway deployment list --service databento-sidecar --limit 20 --json | jq -r --arg id "$deployment_id" '.[] | select(.id == $id) | .status')"
            case "$status" in
              SUCCESS) exit 0 ;;
              FAILED|CRASHED|REMOVED) echo "Sidecar deployment $deployment_id ended $status" >&2; exit 1 ;;
            esac
            sleep 5
          done
          echo "Sidecar deployment $deployment_id did not reach SUCCESS" >&2
          exit 1
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Verify sidecar data for three minutes
        timeout-minutes: 8
        run: railway run --service databento-sidecar -- node --import tsx scripts/verify-sidecar-ready.ts
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Mark live deploy start
        run: echo "LIVE_DEPLOY_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Deploy live engine
        run: |
          deploy_output="$(railway up --service futures-engine-live --detach --json)"
          deployment_id="$(printf '%s\n' "$deploy_output" | tail -n 1 | jq -r '.deploymentId // .id // empty')"
          test -n "$deployment_id"
          echo "LIVE_DEPLOYMENT_ID=$deployment_id" >> "$GITHUB_ENV"
          for _ in $(seq 1 120); do
            status="$(railway deployment list --service futures-engine-live --limit 20 --json | jq -r --arg id "$deployment_id" '.[] | select(.id == $id) | .status')"
            case "$status" in
              SUCCESS) exit 0 ;;
              FAILED|CRASHED|REMOVED) echo "Live deployment $deployment_id ended $status" >&2; exit 1 ;;
            esac
            sleep 5
          done
          echo "Live deployment $deployment_id did not reach SUCCESS" >&2
          exit 1
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Verify live engine initialization
        timeout-minutes: 10
        run: railway run --service futures-engine-live -- env ENGINE_MODE=live DEPLOY_STARTED_AT="$LIVE_DEPLOY_STARTED_AT" EXPECTED_DEPLOYMENT_ID="$LIVE_DEPLOYMENT_ID" EXPECT_LIVE_ARMED=false REQUIRE_LIVE_EDGES_OFF=true node --import tsx scripts/verify-engine-ready.ts
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Mark demo deploy start
        run: echo "DEMO_DEPLOY_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Deploy demo engine
        run: |
          deploy_output="$(railway up --service futures-engine --detach --json)"
          deployment_id="$(printf '%s\n' "$deploy_output" | tail -n 1 | jq -r '.deploymentId // .id // empty')"
          test -n "$deployment_id"
          echo "DEMO_DEPLOYMENT_ID=$deployment_id" >> "$GITHUB_ENV"
          for _ in $(seq 1 120); do
            status="$(railway deployment list --service futures-engine --limit 20 --json | jq -r --arg id "$deployment_id" '.[] | select(.id == $id) | .status')"
            case "$status" in
              SUCCESS) exit 0 ;;
              FAILED|CRASHED|REMOVED) echo "Demo deployment $deployment_id ended $status" >&2; exit 1 ;;
            esac
            sleep 5
          done
          echo "Demo deployment $deployment_id did not reach SUCCESS" >&2
          exit 1
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Verify demo engine initialization
        timeout-minutes: 10
        run: railway run --service futures-engine -- env ENGINE_MODE=demo DEPLOY_STARTED_AT="$DEMO_DEPLOY_STARTED_AT" EXPECTED_DEPLOYMENT_ID="$DEMO_DEPLOYMENT_ID" node --import tsx scripts/verify-engine-ready.ts
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
