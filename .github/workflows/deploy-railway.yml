name: Deploy Futures Engine to Railway

on:
  push:
    branches: [main]
    # The engine imports far more than the three files this list used to name — realtime-edges.ts
    # (which edges exist at all), contract-months.ts (rollover), vault-session-gates.ts, databento.ts,
    # session-time.ts, notifications, db... A change to any of those used to deploy NOTHING, with no
    # error anywhere: the demo engine simply kept running the old code. Widened 2026-08-19 to the
    # whole of src/lib and src/services. Over-deploying is free; a silent stale deploy is not.
    paths:
      - 'src/services/**'
      - 'src/lib/**'
      - 'sidecar/**'
      - 'prisma/**'
      - 'Dockerfile.engine'
      - 'package.json'
      - 'package-lock.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.41.2

      - name: Install verification dependencies
        run: npm ci --ignore-scripts

      - name: Deploy Databento sidecar first
        run: railway up ./sidecar --path-as-root --service databento-sidecar
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Verify sidecar data for three minutes
        timeout-minutes: 8
        run: railway run --service databento-sidecar -- node --import tsx scripts/verify-sidecar-ready.ts
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy live engine
        run: railway up --service futures-engine-live
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy demo engine
        run: railway up --service futures-engine
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
